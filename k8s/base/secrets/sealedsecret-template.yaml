# TEMPLATE: This file shows the structure of the SealedSecret.
# Do NOT commit the actual Secret. Use kubeseal to encrypt:
#
#   kubectl create secret generic sciath-secrets \
#     --namespace sciath \
#     --from-literal=SECRET_KEY=... \
#     --from-literal=DATABASE_URL=... \
#     --from-literal=FIELD_ENCRYPTION_KEY=... \
#     --from-literal=SCALEWAY_ACCESS_KEY_ID=... \
#     --from-literal=SCALEWAY_SECRET_ACCESS_KEY=... \
#     --from-literal=SCALEWAY_BUCKET_NAME=... \
#     --from-literal=EMAIL_HOST_USER=... \
#     --from-literal=EMAIL_HOST_PASSWORD=... \
#     --from-literal=GOOGLE_OAUTH_CLIENT_ID=... \
#     --from-literal=GOOGLE_OAUTH_CLIENT_SECRET=... \
#     --from-literal=GITHUB_OAUTH_CLIENT_ID=... \
#     --from-literal=GITHUB_OAUTH_CLIENT_SECRET=... \
#     --from-literal=GITLAB_OAUTH_CLIENT_ID=... \
#     --from-literal=GITLAB_OAUTH_CLIENT_SECRET=... \
#     --from-literal=NVD_API_KEY=... \
#     --from-literal=FRONTEND_URL=... \
#     --from-literal=SCIATH_WEB_CLIENT_ID=... \
#     --from-literal=ALLOWED_HOSTS=... \
#     --dry-run=client -o yaml | kubeseal --format yaml > sealedsecret.yaml
#
# Then commit sealedsecret.yaml (not this template).
#
# Note: DATABASE_URL is the single source of truth for DB credentials.
# The DBOS worker entrypoint script derives DB_HOST/PORT/USER/PASSWORD/NAME
# from DATABASE_URL automatically.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sciath-secrets
  namespace: sciath
spec:
  encryptedData: {}
