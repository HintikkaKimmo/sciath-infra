apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-api
  namespace: sciath
  labels:
    app: django-api
    app.kubernetes.io/name: django-api
    app.kubernetes.io/part-of: sciath
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: django-api
  template:
    metadata:
      labels:
        app: django-api
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: scw-registry
      initContainers:
        - name: wait-for-migrations
          image: PLACEHOLDER
          command:
            - python
            - -c
            - |
              import django, sys, time
              django.setup()
              from django.db import connection
              for attempt in range(30):
                  try:
                      with connection.cursor() as cursor:
                          cursor.execute("SELECT 1 FROM django_migrations LIMIT 1")
                      print("Migrations table accessible")
                      sys.exit(0)
                  except Exception as e:
                      print(f"Waiting for DB... ({e})")
                      time.sleep(2)
              print("DB not ready after 60s")
              sys.exit(1)
          envFrom:
            - configMapRef:
                name: django-config
            - secretRef:
                name: sciath-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: django
          image: PLACEHOLDER
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: django-config
            - secretRef:
                name: sciath-secrets
          startupProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
