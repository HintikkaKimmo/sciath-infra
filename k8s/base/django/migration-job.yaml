apiVersion: batch/v1
kind: Job
metadata:
  name: django-migrate
  namespace: sciath
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: scw-registry
      containers:
        - name: migrate
          image: PLACEHOLDER
          command: ["bash", "deploy/scripts/migrate.sh"]
          envFrom:
            - configMapRef:
                name: django-config
            - secretRef:
                name: sciath-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
