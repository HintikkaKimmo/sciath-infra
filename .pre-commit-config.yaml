repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-added-large-files
      - id: detect-private-key

  # Commitizen: enforce conventional commit messages
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.4.1
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Gitleaks: Prevent Secret Leakage
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  # Terraform: format + validate
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args: ['--hook-config=--retry-once-with-cleanup=true']
      - id: terraform_tflint
        args: ['--args=--only=terraform_deprecated_interpolation',
               '--args=--only=terraform_deprecated_index',
               '--args=--only=terraform_unused_declarations',
               '--args=--only=terraform_comment_syntax',
               '--args=--only=terraform_documented_outputs',
               '--args=--only=terraform_documented_variables',
               '--args=--only=terraform_typed_variables',
               '--args=--only=terraform_naming_convention',
               '--args=--only=terraform_required_version',
               '--args=--only=terraform_required_providers']

  # Kubeconform: validate k8s manifests
  - repo: local
    hooks:
      - id: kubeconform
        name: kubeconform
        entry: bash -c 'kubectl kustomize k8s/overlays/staging | kubeconform --strict --summary 2>&1; kubectl kustomize k8s/overlays/prod | kubeconform --strict --summary 2>&1'
        language: system
        pass_filenames: false
        files: 'k8s/.*\.yaml$'

  # Shell lint
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ['--severity=warning']
