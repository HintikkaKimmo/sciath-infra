name: Terraform

on:
  pull_request:
    paths: ['terraform/**', '.github/workflows/terraform.yml']
  push:
    branches: [main]
    paths: ['terraform/**', '.github/workflows/terraform.yml']
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, prod]
      operation:
        description: Cloud operation (apply changes real infrastructure)
        required: true
        default: plan
        type: choice
        options: [plan, apply]
      k8s_version:
        description: Supported Scaleway Kubernetes version to plan or apply
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.event.inputs.environment || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: '1.16.4'
  TF_IN_AUTOMATION: 'true'

jobs:
  validate:
    name: Validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [staging, prod]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Check formatting
        run: terraform fmt -check -recursive terraform
      - name: Initialize providers without remote state
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false -lockfile=readonly -input=false
      - name: Validate configuration
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform validate -no-color

  cloud:
    name: ${{ inputs.operation }} (${{ inputs.environment }})
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      TF_VAR_k8s_version: ${{ inputs.k8s_version }}
    defaults:
      run:
        working-directory: terraform/environments/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform init -lockfile=readonly -input=false
      - run: terraform plan -no-color -input=false -out=reviewed.tfplan
      - name: Apply the generated plan
        if: inputs.operation == 'apply'
        run: terraform apply -input=false reviewed.tfplan
